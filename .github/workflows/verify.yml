# PR gate so Containerfile-only and workflow-only changes (notably Renovate's
# base-image and GitHub-Actions bumps) have a green check to auto-merge against.
# The build pipeline (libraries.yml) only runs on cron/dispatch, so without this
# a PR carried no status at all. Kept deliberately small: lint the one generic
# Containerfile (hadolint) and the workflows (actionlint, which also shellchecks
# the run: blocks). Both tools come from the metio/toolchains groups the
# .breto.edn names, so a local run and CI agree. A single all-green aggregate
# is the only check to mark required in branch protection.
name: Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  hadolint:
    name: Containerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@f821815a1c92cfcba086d6bec4ede7a87deec697 # 2026.10.31191131
        with:
          registries: github:metio/toolchains
      # hadolint discovers the repo's .hadolint.yaml from the working dir.
      - run: hadolint Containerfile
  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@f821815a1c92cfcba086d6bec4ede7a87deec697 # 2026.10.31191131
        with:
          registries: github:metio/toolchains
      - run: yamllint .
  actionlint:
    name: Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@f821815a1c92cfcba086d6bec4ede7a87deec697 # 2026.10.31191131
        with:
          registries: github:metio/toolchains
      # shellcheck comes with @lint, so actionlint lints run: blocks too.
      - run: actionlint
      - env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity low --format github .
  all-green:
    name: All checks passed
    needs: [hadolint, yaml, actionlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every dependency succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e 'all(.[].result; . == "success" or . == "skipped")' \
            || { echo "::error::a verify job did not pass"; exit 1; }
